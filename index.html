<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Clube da Casa Gorgulho</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top right, #f1f5f9, #e2e8f0);
      color: #0f172a;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    .video-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid #ffffff;
    }
    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.2);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ea580c, #f97316);
      transition: width 0.1s linear;
    }

    .info-section {
      flex: 1;
      height: 100%;
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 2px solid #f1f5f9;
    }
    .header-text {
      flex: 1;
    }
    
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #ffffff;
      font-size: clamp(0.85rem, 1.1vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 8px 22px;
      border-radius: 50px;
      margin-bottom: 1.2vh;
      box-shadow: 0 6px 16px rgba(234, 88, 12, 0.3);
    }

    .header h1 {
      font-size: clamp(1.6rem, 2.3vw, 2.7rem);
      font-weight: 900;
      line-height: 1.15;
      color: #0f2942;
      letter-spacing: -0.5px;
    }
    .header h1 span {
      color: #ea580c;
    }

    .logo-img {
      height: clamp(100px, 15vh, 150px);
      max-width: 280px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
    }

    
    
      
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
      .header-text h1, .header h1 {
      text-transform: uppercase !important;
}
      /* Motor TV Standard 2026 */
    .header-text h1, .header h1 {
      text-transform: uppercase !important;
    }
    .header-text h1 span, .header h1 span {
      text-transform: uppercase !important;
    }
    .info-section {
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      margin-top: 2rem !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      color: #222 !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <div class="video-section">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" />
        <video id="player" autoplay playsinline muted loop preload="auto">
        <source id="video-source" src="video_1.mp4" type="video/mp4">
      </video>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge" id="post-badge">Feliz obra pra você!</span>
          <h1>Clube da Casa <span>Gorgulho</span></h1>
        </div>
        <img src="logo.png" alt="Logo Clube da Casa Gorgulho" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando novidades e ofertas...
        </div>
      </div>
    </div>
  </div>

      <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(function() {
        var diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          var descendo = true;
          var pausado = false;

          window.__scrollInterval = setInterval(function() {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(function() {
                  descendo = false;
                  pausado = false;
                }, 3000);
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(function() {
                  pausado = false;
                }, 3500);
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var containerElem = document.getElementById('caption-container');
      var captionElem = document.getElementById('caption-text');
      var player = document.getElementById('player');
      var videoSource = document.getElementById('video-source');
      var imagePlayer = document.getElementById('image-player');

      var ts = new Date().getTime();

      fetch('data.json?v=' + ts)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(posts) {
          if (!Array.isArray(posts) || posts.length === 0) {
            if (captionElem) captionElem.textContent = 'Nenhuma publicação encontrada.';
            return;
          }

          var urlParams = new URLSearchParams(window.location.search);
          var postParam = urlParams.get('post');
          var postIdx = parseInt(postParam, 10);

          var currentPost = posts[0];
          if (!isNaN(postIdx)) {
            var encontrado = posts.filter(function(p) {
              return p.id === postIdx || String(p.id) === String(postIdx);
            });
            currentPost = (encontrado.length > 0) ? encontrado[0] : (posts[postIdx - 1] || posts[0]);
          }

          var texto = currentPost.caption || currentPost.text || '';
          texto = texto.replace(/\n{3,}/g, '\n\n').trim();

          if (captionElem) {
            captionElem.textContent = texto;
            iniciarAutoScroll(containerElem);
          }

          var midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
          var isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.indexOf('.jpg') !== -1 || midiaArquivo.indexOf('.png') !== -1));

          if (isFoto) {
            if (player) {
              player.pause();
              player.style.display = 'none';
            }
            if (imagePlayer) {
              imagePlayer.style.display = 'block';
              imagePlayer.src = midiaArquivo + '?v=' + ts;
            }
          } else {
            if (imagePlayer) imagePlayer.style.display = 'none';
            if (player && videoSource) {
              player.style.display = 'block';
              player.style.backgroundColor = '#000';
              player.loop = true;

              player.onended = function() {
                player.currentTime = 0;
                player.play().catch(function() {});
              };

              videoSource.src = midiaArquivo + '?v=' + ts;
              player.load();
              player.play().catch(function(e) { console.log('Autoplay:', e); });
            }
          }
        })
        .catch(function(err) {
          console.error('Erro ao carregar dados:', err);
          if (captionElem) captionElem.textContent = 'Erro ao carregar dados do mural.';
        });
    });
  </script>
</body>
</html>
